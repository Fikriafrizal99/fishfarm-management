services:
  postgres:
    image: postgres:17-alpine
    container_name: fishfarm-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fishfarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fishfarm_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fishfarm_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fishfarm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fishfarm} -d ${POSTGRES_DB:-fishfarm_dev}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  fishfarm_postgres_data:
